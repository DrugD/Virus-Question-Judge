[project]
name = "virus-question-judge"
version = "0.1.0"
description = "Rubric-based DeepEval judge for petabase-scale RNA-virus scientific-question generation."
requires-python = ">=3.10"
dependencies = [
  "deepeval>=1.4.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "openai>=1.40.0",
  "anthropic>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["eval*"]
